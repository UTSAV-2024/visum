# render.yaml - Render Blueprint configuration for Visum backend
#
# Runs on Docker rather than Render's native Python runtime. This is required,
# not a preference: Playwright's Chromium needs system shared libraries
# (libnss3, libatk, libgbm, ...) that can only be installed as root. On the
# native runtime `playwright install chromium` downloads the browser but it
# cannot launch, so the JavaScript Rendering and Page Load Speed checks silently
# reported "not measured" on every production scan. The Playwright base image
# ships the browser and its dependencies already.
services:
  - type: web
    name: visum-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Pinned explicitly: a Blueprint with no `plan` defaults to a paid tier.
    # Free gives 0.1 CPU / 512 MB, which is tight for Chromium — see the
    # concurrency note below. Raise this if scans OOM.
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://visum-eight.vercel.app
      # Chromium needs several hundred MB per instance, and the free tier only
      # has 512 MB in total. One scan at a time is the difference between a
      # browser that launches and one the kernel kills.
      - key: MAX_CONCURRENT_SCANS
        value: "1"
      # Playwright's own navigation timeout must stay below SCAN_TIMEOUT_SECONDS,
      # or the outer timeout hard-cancels every scan before the crawler's
      # graceful static-HTML fallback gets a chance to run. Set explicitly
      # here rather than relying on code defaults staying in sync.
      - key: CRAWLER_TIMEOUT_MS
        value: "25000"
      - key: SCAN_TIMEOUT_SECONDS
        value: "50"
